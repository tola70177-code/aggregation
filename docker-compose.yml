services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot_aggregation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bot_aggregation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TDLIB_API_ID: ${TDLIB_API_ID}
      TDLIB_API_HASH: ${TDLIB_API_HASH}
      TDLIB_DATABASE_DIR: /app/tdlib-data
      TDLIB_FILES_DIR: /app/tdlib-files
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - tdlib_data:/app/tdlib-data
      - tdlib_files:/app/tdlib-files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  tdlib_data:
  tdlib_files:
