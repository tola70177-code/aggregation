databaseChangeLog:

  # ── source_channels ──────────────────────────────────────────────────
  - changeSet:
      id: 1
      author: iohans
      changes:
        - createTable:
            tableName: source_channels
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: channel_name
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  # ── destination_channel ──────────────────────────────────────────────
  - changeSet:
      id: 2
      author: iohans
      changes:
        - createTable:
            tableName: destination_channel
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false

  # ── processed_posts ──────────────────────────────────────────────────
  - changeSet:
      id: 3
      author: iohans
      changes:
        - createTable:
            tableName: processed_posts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: source_channel_id
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: content_link
                  type: VARCHAR(2048)
              - column:
                  name: content_fields
                  type: TEXT
        - createIndex:
            tableName: processed_posts
            indexName: idx_processed_posts_content_link
            columns:
              - column:
                  name: content_link

  # ── user_template ────────────────────────────────────────────────────
  - changeSet:
      id: 4
      author: iohans
      changes:
        - createTable:
            tableName: user_template
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: template_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: fields
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: has_image
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
